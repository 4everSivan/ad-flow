# ad-flow Agentic Execution Workflow (Machine-Oriented)
# Specification for AI Agent initialization execution
version: "1.5.0"
workflow_id: "adflow_init"
target_actor: "AI_AGENT"
trigger_aliases:
  - "$ad-flow"
  - "/ad-flow"
  - "ad-flow"
  - "adflow"
description: "Initialize once; explicitly invoke again only to synchronize governance specifications. Daily development uses installed project rules."

execution_contract:
  entrypoint: "Bootstrap/upgrade only; no new-card/archive subcommands or repeated daily invocation"
  daily_assets: "Target AGENTS.md, directory READMEs, indexes, templates, and scripts/adflow-verify; no skill-source dependency"
  lifecycle: "Keep dual tracks, card states, human acceptance, zero-sediment, and archiving unchanged"
  input_separation: "Separate policy, current-step instructions, source evidence, examples, and output contract; XML is optional for dynamic sources and grants no authority"
  authority: "Reuse explicit authorization for the target operation; otherwise confirm existing-asset migration. Initialization does not authorize deploy/push/merge/cleanup/signoff"
  new_checks: "New semantic diagnostics stay ADVISORY; existing identity, routing, and per-track state contracts remain hard checks. Keep exit 0/4/6 semantics and do not migrate old cards automatically. One documented promotion from 1.4.0: ARCHIVE_NON_TERMINAL (the archive area holds terminal cards only) is a hard check enforcing the v1.1.0 archive preconditions; legacy frozen non-terminal archived cards need the human-driven remediation flow in the archive README. MILESTONE_STATUS_DRIFT stays advisory. ARCHIVE_NON_TERMINAL covers index-routed cards and card files found directly under docs/archive/. DEP_NOT_READY, ARCHIVE_UNREGISTERED, TAG_DUPLICATE and PLACEHOLDER_UNRENDERED are advisory. TOOL_VERSION_DRIFT is an init-mode installation-integrity check. The read-only release preflight (--release VERSION) is opt-in and is not run during initialization or upgrade"
  card_receipt: "Daily rule installed by AGENTS.md section 2.3: after each card checkpoint sync, 'scripts/adflow-verify --card ID --receipt' re-checks read-only and prints the fixed receipt; agents forward fact rows verbatim and fill only the 未覆盖 and 需要你 rows. --record stores gate.from_status so receipts show the recorded transition. Not used during initialization or upgrade"

backup_gitignore:
  target_file: "${target_dir}/.gitignore"
  pattern: "/_adflow_backup/"
  update_rule: "Before creating any backup, create .gitignore if absent; otherwise preserve existing contents and append the rule only if no effective equivalent exists. Add a separating newline if needed and append after conflicting negations; repeated execution must not duplicate effective rules"
  verification: "In a target Git repository, use git check-ignore --no-index on the backup README and nested snapshot paths; outside Git, inspect the root rule without initializing a repository"
  tracked_files: "Use git ls-files -- _adflow_backup/ to detect tracked backups. Report these separately: .gitignore does not untrack them; never remove index entries automatically"

coding_standards:
  dest: "docs/standards/coding.json"
  base_template: "templates/docs/standards/coding.json.tpl"
  available_languages: ["python", "go", "javascript", "typescript", "java", "shell", "cpp", "rust"]
  profile_template: "templates/coding-standards/${language}.json"
  selection: "Offer multiple languages or common-only during initialization. Explicit choices win; otherwise use stated defaults from manifests and authored sources, excluding dependencies/generated files/backups. Empty or uncertain stacks use common-only. No additional approval gate"
  composition: "Parse base and selected fragments as JSON; put each whole fragment under languages[language]. Preserve common, precedence and sources. Serialize valid UTF-8 JSON; copy only selected profiles, with no skill-source paths or profile inheritance"
  preservation: "Preserve an existing document byte-for-byte, restoring its saved original after migration if needed, including docs/devel/coding-standards.json; stop on differing legacy/canonical copies; change its rules only on explicit user request. Merge the three canonical paths into docs/index.json.standards without replacing other fields"
  output_language: "English for coding specifications and language profiles. Workflow execution instructions are English; other generated bodies, design headings/filenames, guides and card descriptions retain established Chinese. Keep metadata/JSON keys, identifiers and commands unchanged; preserve custom rules and quotations verbatim"
  tools: "Existing project conventions and formatter/linter configs take priority. No tool installation, config rewrite or bulk source formatting"
  compatibility: "Same-version checks accept legacy guide names, C/T template paths and optional docs/devel/coding-standards.json read-only. Fresh initialization or requested specification sync installs canonical standards; preserve custom rules and historical records"

# Invariants
invariants:
  - id: "INV_NO_AGENT_DELETE_BACKUP"
    rule: "Authorized initialization/upgrade may create fresh snapshots; captured originals are read-only. Never delete, move, overwrite, or prune existing snapshots"
    severity: "FATAL"
  - id: "INV_NO_AGENT_DELETE_LOCAL"
    rule: "Initialization/upgrade leave existing local/ untouched. Later authorized build/test/deploy may write outputs and reports there; deleting/resetting existing contents is outside this workflow"
    severity: "FATAL"
  - id: "INV_EVIDENCE_BASED_DESIGN"
    rule: "AI Agent is strictly forbidden from creating hollow placeholder design docs. When legacy docs exist in '_adflow_backup/original_docs/' or source code exists, Agent MUST synthesize and reconstruct Living Baseline design docs (00-系统总体设计.md, 01~NN-[module].md) adhering to ad-flow 4-chapter and @topic standards."
    severity: "FATAL"
  - id: "INV_BASE_GOVERNANCE_COUNT"
    rule: "Fresh initialization creates 24 standardized governance files including coding standards (plus N reconstructed living design docs if legacy docs/code exist); older installations follow coding_standards.compatibility"
    severity: "FATAL"
  - id: "INV_VERSION_AWARE_UPGRADE_GUARD"
    rule: "Matching version requires read-only installation integrity checks before an unchanged exit; incomplete initialization resumes unfinished steps without repeating migration. Older versions use the preserving upgrade pipeline"
    severity: "FATAL"
  - id: "INV_NO_README_AS_DESIGN_DOC"
    rule: "AI Agent is strictly forbidden from setting 'design_doc' or 'doc' in any C/T card or index.json to any README.md (including 'docs/devel/design/README.md'). It MUST point to a living baseline design doc ('00-系统总体设计.md' or '01~99-[module].md') containing the matching '<!-- @topic: TopicName -->'. If missing, Agent must follow Doc First to create/update the design doc first."
    severity: "FATAL"
  - id: "INV_RELEASE_ARCHIVE_GATE"
    rule: "Tagging, publishing, or moving any card into docs/archive/ requires the whole release batch to be terminal (C closed / T completed), checked mechanically with 'scripts/adflow-verify --release <version>' Exit 0 (plain Exit 0 alone does not prove batch terminality; humans still confirm the release scope and the batch of cards without version). Non-terminal cards must never enter the archive area; the verifier reports ARCHIVE_NON_TERMINAL as a deterministic violation. Historical frozen non-terminal archived cards are remediated only by human disposition per the archive README remediation flow, never rewritten during upgrade"
    severity: "FATAL"

pipeline:
  - step: 1
    name: "SURVEY_PROJECT_ASSETS"
    description: "Inspect target workspace, check version/idempotency tag, and determine project category"
    action: "INSPECT"
    inputs:
      target_dir: "${TARGET_DIR:-.}"
    idempotency_and_version_check:
      scan_files:
        - "AGENTS.md"
        - "Agent.md"
        - "agents.md"
        - "docs/index.json"
      tag_pattern: "<!-- @ad-flow: initialized(?: v(?P<ver>[0-9.]+))? -->"
      current_version: "1.5.0"
      compare: "Parse numeric version components using code; conflicting/malformed sources stop without writes"
      on_version_newer:
        state: "VERSION_NEWER"
        action: "TERMINATE_WITHOUT_DOWNGRADE"
      on_version_conflict:
        state: "VERSION_CONFLICT"
        action: "REPORT_WITHOUT_WRITES"
      on_version_match:
        state: "ALREADY_INITIALIZED_UP_TO_DATE"
        action: "CHECK_INTEGRITY_BEFORE_EXIT"
        check: "Run init and process verification without --record; use the skill verifier read-only if its installed copy is missing. Check applicable Step 7 source-backed designs and registrations separately"
        on_complete: "Exit unchanged and report process findings; existing-card violations do not authorize card migration. Missing unregistered coding standards in older installations are not incomplete initialization"
        on_incomplete: "Within existing initialization authorization, reuse preserved sources and resume only unfinished Steps 4-8; preserve business records and completed work, never repeat migration. Completion requires Step 8 evaluation"
        on_explicit_sync: "Set NEEDS_UPGRADE and use the preserving upgrade pipeline"
        message: "Check same-version installation read-only; exit unchanged if complete, otherwise resume missing steps without repeating migration."
      on_version_outdated:
        state: "NEEDS_UPGRADE"
        action: "BRANCH_TO_UPGRADE_PIPELINE"
        message: "An older governance version was found; synchronize specifications while preserving project assets."
    detection_rules:
      code_indicators:
        - "package.json"
        - "Cargo.toml"
        - "pyproject.toml"
        - "go.mod"
        - "pom.xml"
        - "Makefile"
        - "src/"
        - "lib/"
        - "app/"
      doc_indicators:
        - "*.md"
        - "docs/"
        - "doc/"
        - "openspec/"
        - "openspecs/"
        - ".openspec/"
        - "superpower/"
        - "superpowers/"
        - ".superpower/"
        - ".superpowers/"
        - "specs/"
        - "spec/"
        - "specification/"
        - "specifications/"
        - "architecture/"
      agent_rule_files:
        - "Agent.md"
        - "AGENTS.md"
        - "agents.md"
      coding_languages: "Apply coding_standards.selection; package dependencies or template examples alone do not establish authored languages"
    outputs:
      state: "ALREADY_INITIALIZED_UP_TO_DATE | NEEDS_UPGRADE | VERSION_NEWER | VERSION_CONFLICT | EMPTY_PROJECT | ONGOING_CODE_AND_DOCS | ONGOING_CODE_ONLY"
      routing: "Steps 2-3 run only for ONGOING_* states; NEEDS_UPGRADE uses upgrade_pipeline; ALREADY_INITIALIZED_UP_TO_DATE resumes only Steps 4-8 when incomplete; VERSION_* states stop without writes"
      existing_agent_file: "path | null"
      selected_languages: "List of available language IDs; [] means common-only; preserve existing standards on sync"

  - step: 2
    name: "HUMAN_CONFIRMATION_GATE"
    description: "Guard against unauthorized modification on existing projects"
    condition: "state in ('ONGOING_CODE_AND_DOCS', 'ONGOING_CODE_ONLY') and not has_flag('--yes') and not prior_authorization_for_target_migration"
    action: "PROMPT_USER"
    prompt: |
      检测到当前项目已有代码或文档资产。
      接入 ad-flow 前将先在 `_adflow_backup/` 完整备份现有文档。
      是否确认初始化？[y/N]
    branches:
      on_reject:
        action: "TERMINATE"
        exit_code: 0
        message: "Cancelled by the user; exit without changes."
      on_confirm:
        action: "CONTINUE_TO_STEP_3"

  - step: 3
    name: "CREATE_SAFE_BACKUP"
    description: "Create isolation snapshot zone _adflow_backup/ before modifying target"
    condition: "state in ('ONGOING_CODE_AND_DOCS', 'ONGOING_CODE_ONLY')"
    action: "CREATE_ISOLATION_SNAPSHOT"
    sub_tasks:
      - check_destinations: "Inventory all snapshot destinations before moving assets; stop on collisions, never overwrite captured originals"
      - ensure_gitignore: "Apply backup_gitignore before creating _adflow_backup/"
      - create_dir: "${target_dir}/_adflow_backup"
      - write_file:
          path: "${target_dir}/_adflow_backup/README.md"
          if_absent: true
          content: |
            # ad-flow 安全备份与迁移暂存区 (_adflow_backup/)
            > 已捕获的原始快照只读，禁止删除、移动或覆盖。
            > 授权初始化或升级可创建新的独立快照；确认迁移结果后由人类负责最终清理。
      - branch_backup:
          if_has_docs:
            action: "SNAPSHOT_CLASSIFIED_DOC_ASSETS"
            critical_docs_dir_rule:
              rule: "CRITICAL: If '${target_dir}/docs/' exists, AI Agent MUST execute atomic isolation: mkdir -p ${target_dir}/_adflow_backup/original_docs/ && mv ${target_dir}/docs ${target_dir}/_adflow_backup/original_docs/docs && mkdir -p ${target_dir}/docs. AI must NEVER perform in-place merge in root docs/."
            sources:
              existing_docs_dir:
                source: "${target_dir}/docs"
                dest: "${target_dir}/_adflow_backup/original_docs/docs"
                action: "ATOMIC_MOVE"
              directories:
                - "doc/"
                - "openspec/"
                - "openspecs/"
                - ".openspec/"
                - "superpower/"
                - "superpowers/"
                - ".superpower/"
                - ".superpowers/"
                - "specs/"
                - "spec/"
                - "specification/"
                - "architecture/"
              files:
                - "*.md"
            classification_rule: "Directory names are candidates, not proof of documentation: retain source, tests, and build/runtime inputs in place. Inventory actual document assets before moving"
            root_files_rule: "Copy root Markdown and agent rules into original_docs/root_markdowns/ before managed replacement; retain other originals in place. Do not move *.txt by extension, especially requirements.txt or CMakeLists.txt; include other prose files only after explicit classification"
            dest: "${target_dir}/_adflow_backup/original_docs/"
            behavior: "Atomically move existing docs/ into original_docs/docs/ and recreate docs/; move other confirmed documentation directories only. Copy root documents and agent rules into original_docs/root_markdowns/ before managed replacement; retain build inputs and other originals in place"
          if_code_only:
            action: "ANALYZE_AND_DRAFT"
            dest: "${target_dir}/_adflow_backup/analyzed_drafts/"

  - step: 4
    name: "INJECT_AGENTS_MD"
    description: "Inject project constitution AGENTS.md, merging existing custom rules"
    action: "TEMPLATE_INJECT_WITH_RULE_MERGE"
    inputs:
      template: "templates/AGENTS.md.tpl"
      target_file: "${target_dir}/AGENTS.md"
    merge_logic:
      if_existing_agent_file:
        collect_rules: "Collect project-specific rules from every distinct agent file before replacement; retain source attribution and all original snapshots"
        extract_section: "## 项目自定义规则"
        legacy_section: "## Project Custom Rules"
        if_section_absent: "For untagged originals retain all rules. For previously managed files retain project-specific text outside identifiable managed sections, excluding old initialization markers and identifiable old managed rules; retain uncertain text and report conflicts"
        legacy_aliases: "After snapshotting and collecting every distinct file's project rules, make distinct Agent.md/agents.md aliases pointers to AGENTS.md without stale ad-flow tags; detect case-insensitive aliases before writing so the canonical file is not overwritten"
        append_to_bottom: |
          ---

          ## 项目自定义规则 (Project Custom Rules)

          > 从原项目的 `{existing_filename}` 原样保留本项目特有的业务、架构与团队规则：

          {extracted_rules}

  - step: 5
    name: "SCAFFOLD_DIRECTORIES_AND_READMES"
    description: "Create all 10 governance directories with their respective dedicated README.md"
    action: "WRITE_README_MATRIX"
    mappings:
      - dir: "${target_dir}/docs"
        readme: "${target_dir}/docs/README.md"
        template: "templates/docs/README.md.tpl"
      - dir: "${target_dir}/docs/devel"
        readme: "${target_dir}/docs/devel/README.md"
        template: "templates/docs/devel-README.md.tpl"
      - dir: "${target_dir}/docs/devel/design"
        readme: "${target_dir}/docs/devel/design/README.md"
        template: "templates/docs/design/README.md.tpl"
        constraints:
          - "Embeds a four-chapter design outline with requirements, architecture, rules, verification, evolution and references as appropriate subsections"
          - "Hollow placeholder specs are prohibited; real specs are generated in STEP 7 via legacy doc synthesis"
      - dir: "${target_dir}/docs/devel/change"
        readme: "${target_dir}/docs/devel/change/README.md"
        template: "templates/docs/change/README.md.tpl"
      - dir: "${target_dir}/docs/devel/task"
        readme: "${target_dir}/docs/devel/task/README.md"
        template: "templates/docs/task/README.md.tpl"
      - dir: "${target_dir}/docs/devel/todo"
        readme: "${target_dir}/docs/devel/todo/README.md"
        template: "templates/docs/todo/README.md.tpl"
      - dir: "${target_dir}/docs/devel/env"
        readme: "${target_dir}/docs/devel/env/README.md"
        template: "templates/docs/env/README.md.tpl"
      - dir: "${target_dir}/docs/assets"
        readme: "${target_dir}/docs/assets/README.md"
        template: "templates/docs/assets/README.md.tpl"
      - dir: "${target_dir}/docs/guide"
        readme: "${target_dir}/docs/guide/README.md"
        template: "templates/docs/guide/README.md.tpl"
      - dir: "${target_dir}/docs/archive"
        readme: "${target_dir}/docs/archive/README.md"
        template: "templates/docs/archive-README.md.tpl"

  - step: 6
    name: "INJECT_HUBS_AND_CONFIGS"
    description: "Inject index routing hubs, selected coding standards, card templates, todo buffers, guide docs, and root configs"
    action: "WRITE_FILES"
    initial_data: "Empty indexes and todo/design registrations; examples are not real project records"
    placeholder_rendering: "Applies to Steps 4-6. Replace MyProject with the project name; replace YYYY-MM-DD with the initialization date in Markdown metadata header lines and JSON created/last_change/updated_at. Keep format examples in bodies and fenced outlines; on upgrade retain existing project names and created dates. Leftovers surface as PLACEHOLDER_UNRENDERED advisories"
    mappings:
      - dest: "${target_dir}/docs/index.json"
        template: "templates/docs/index.json.tpl"
      - dest: "${target_dir}/docs/devel/index.json"
        template: "templates/docs/devel-index.json.tpl"
      - dest: "${target_dir}/docs/standards/coding.json"
        template: "templates/docs/standards/coding.json.tpl"
        note: "Apply coding_standards composition/preservation with selected_languages; merge the canonical index pointer"
      - dest: "${target_dir}/docs/guide/index.json"
        template: "templates/docs/guide/index.json.tpl"
      - dest: "${target_dir}/docs/devel/change/index.json"
        template: "templates/docs/change/index.json.tpl"
      - dest: "${target_dir}/docs/standards/change-template.json"
        template: "templates/docs/standards/change-template.json.tpl"
      - dest: "${target_dir}/docs/devel/task/index.json"
        template: "templates/docs/task/index.json.tpl"
      - dest: "${target_dir}/docs/standards/task-template.json"
        template: "templates/docs/standards/task-template.json.tpl"
      - dest: "${target_dir}/docs/devel/todo/now.md"
        template: "templates/docs/todo/now.md.tpl"
      - dest: "${target_dir}/docs/devel/todo/future.md"
        template: "templates/docs/todo/future.md.tpl"
      - dest: "${target_dir}/docs/devel/env/01-环境缓存与依赖清理指南.md"
        template: "templates/docs/env/01-环境缓存与依赖清理指南.md.tpl"
      - dest: "${target_dir}/docs/guide/01-本地部署指南.md"
        template: "templates/docs/guide/01-本地部署指南.md.tpl"
      - dest: "${target_dir}/CHANGELOG.md"
        template: "templates/docs/changelog.md.tpl"
      - dest: "${target_dir}/scripts/adflow_verify.py"
        template: "scripts/adflow_verify.py"
        note: "Verbatim copy of the process-discipline gate (stdlib-only); not a .tpl"
      - dest: "${target_dir}/scripts/adflow-verify"
        template: "scripts/adflow-verify"
        note: "Verbatim copy of the sh wrapper; preserve executable permission"

  - step: 7
    name: "SYNTHESIZE_LEGACY_DOCS_TO_LIVING_BASELINE"
    description: "Read backed up documents and source code, reconstruct living baseline design docs and register them into indexes"
    action: "SYNTHESIZE_AND_RECONSTRUCT"
    condition: "target_dir/_adflow_backup/original_docs/ has files OR target_dir has source code"
    execution_rules:
      - "Inspect all files in `_adflow_backup/original_docs/` (e.g. openspec/, superpower/, specs/, legacy docs/, root md files) and project source files (src/, cmd/, app/, etc.)."
      - "Extract system macro-architecture and domain breakdown; retain source locations and explicitly report unresolved claims instead of inventing facts."
      - "Generate `docs/devel/design/00-系统总体设计.md`: Global system topology, layer definitions, tech stack, and module matrix."
      - "For each identified domain/module, generate `docs/devel/design/01~NN-[模块中文名].md`:
         - Follow the four-chapter Chinese outline in the design README; expand goals/non-goals, requirements, architecture, contracts and change links as needed
         - English metadata headers: created, last-change, status; project release version only where applicable
         - Mandatory topic anchor: `<!-- @topic: TopicName -->`
         - Direct reference to changelog index: `[变更总账 (TopicName)](../change/index.json#TopicName)`"
      - "Preserve established design filenames and links during resume/synchronization; Language defaults do not rename historical designs."
      - "Automatically register all synthesized design docs and Topics into:
         - `docs/devel/design/README.md` (Update the Chinese module-matrix table from the README template)
         - `docs/devel/index.json` (Register under design entries)"

  - step: 8
    name: "DOD_VERIFICATION_AND_REPORT"
    description: "Execute hard assertions and report entry points to human developer"
    action: "ASSERT_AND_REPORT"
    evaluation_loop:
      mechanical: "Run init and process verifier with --json; findings identify code/path. ADVISORY does not affect exit status"
      semantic: "Compare generated design claims to source evidence and registrations; verify snapshot/runtime preservation separately"
      repair_scope: "Only generated/managed assets within authorization; never repeat migration, rewrite old business cards, or relax hard gates"
      max_repair_passes: 3
      stop_when: "Same blocker persists twice, or repair needs new authority/source facts"
      report: "Separate file generation, mechanical results, semantic evidence, and runtime/human acceptance gaps"
    assertions:
      base_file_count_minimum: 24
      verifier_files_required: ["scripts/adflow_verify.py", "scripts/adflow-verify"]
      required_files_exist:
        - "AGENTS.md"
        - "CHANGELOG.md"
        - "docs/README.md"
        - "docs/index.json"
        - "docs/assets/README.md"
        - "docs/guide/README.md"
        - "docs/guide/index.json"
        - "docs/guide/01-本地部署指南.md"
        - "docs/devel/README.md"
        - "docs/devel/index.json"
        - "docs/standards/coding.json"
        - "docs/devel/design/README.md"
        - "docs/devel/change/README.md"
        - "docs/devel/change/index.json"
        - "docs/standards/change-template.json"
        - "docs/devel/task/README.md"
        - "docs/devel/task/index.json"
        - "docs/standards/task-template.json"
        - "docs/devel/todo/README.md"
        - "docs/devel/todo/now.md"
        - "docs/devel/todo/future.md"
        - "docs/devel/env/README.md"
        - "docs/devel/env/01-环境缓存与依赖清理指南.md"
        - "docs/archive/README.md"
      forbidden_files_not_exist:
        - "docs/devel/design/01-系统设计方案.md"
        - "docs/devel/change/template.json"
        - "docs/devel/task/template.json"
      backup_security_check:
        rule: "_adflow_backup/ must remain intact if created; AI must NEVER delete it. Verify backup_gitignore coverage separately from adflow-verify and report already tracked backup paths"
      local_security_check:
        rule: "Initialization/upgrade leave existing local/ untouched; later authorized build/test/deploy may write there. Instance operations verify the report against runtime, consult guides on drift; unit tests need no deployment report"
      baseline_synthesis_check:
        rule: "If legacy docs existed in _adflow_backup/original_docs/, at least 00-系统总体设计.md and corresponding 01~NN design docs must be synthesized"
      coding_standards_check:
        rule: "For newly composed JSON, common contains nonempty English rule arrays grouped by concern and languages contains exactly selected profiles, each with format, naming, documentation, rules and official sources. For preserved JSON, compare bytes with the saved original. Verify local README/AGENTS links and index pointer. Report choices; do not claim style compliance from the process verifier"
      process_gate_check:
        rule: "Run 'scripts/adflow-verify --mode init' (base assets, canonical or legacy template/guide paths, registered/present coding JSON, tools and a verifier copy whose VERSION matches adflow_version) and 'scripts/adflow-verify' (active-card discipline plus archive terminality: non closed/completed cards in docs/archive, routed or found on disk, fail as ARCHIVE_NON_TERMINAL). Exit 0 required before reporting success; Exit 4 blocks the success report until violations are fixed. Older installations follow coding_standards.compatibility; historical frozen archived cards are human-disposition items, never rewritten by upgrade"
    report_to_user:
      key_entries:
        - "AGENTS.md"
        - "docs/README.md"
        - "docs/standards/coding.json"
        - "docs/devel/design/README.md"
        - "docs/guide/01-本地部署指南.md"
        - "docs/devel/env/README.md"
      synthesized_design_docs: "List all generated 00~NN design docs if reconstructed from legacy assets"
      warning: "AI must not delete captured backups or existing local/ data. Humans own cleanup after verification."

upgrade_pipeline:
  trigger: "state == 'NEEDS_UPGRADE'"
  description: "Smoothly synchronize and upgrade all governance constitutions, README specifications, and templates to v1.5.0"
  steps:
    - step: "U1_SNAPSHOT_CURRENT_GOVERNANCE"
      action: "CREATE_UPGRADE_SNAPSHOT"
      before_snapshot: "Apply backup_gitignore before creating the upgrade snapshot"
      dest: "${target_dir}/_adflow_backup/upgrade_snapshot/${run_id}/"
      collision_rule: "Fresh directory only; leave existing snapshots untouched"
    - step: "U2_SYNC_AGENTS_CONSTITUTION"
      action: "UPDATE_AGENTS_MD"
      template: "templates/AGENTS.md.tpl"
      preservation_rule: "Preserve project-specific rules from all distinct agent files as in Step 4 without altering captured originals; exclude stale markers and identifiable old managed rules"
      tag_rule: "Retain the previous initialization marker until U5; do not publish the new version in U2"
    - step: "U3_SYNC_DIRECTORY_READMES"
      action: "UPDATE_STANDARD_READMES"
      targets:
        - "docs/README.md"
        - "docs/assets/README.md"
        - "docs/devel/README.md"
        - "docs/devel/design/README.md"
        - "docs/devel/change/README.md"
        - "docs/devel/task/README.md"
        - "docs/devel/todo/README.md"
        - "docs/devel/env/README.md"
        - "docs/guide/README.md"
        - "docs/archive/README.md"
      note: "Update managed guidelines only; preserve project content, user module registrations in design/README.md and the archive batch list (归档批次清单) with linked errata in archive/README.md"
    - step: "U4_SYNC_CARD_TEMPLATES"
      action: "UPDATE_TEMPLATES"
      targets:
        - dest: "docs/standards/change-template.json"
          template: "templates/docs/standards/change-template.json.tpl"
        - dest: "docs/standards/task-template.json"
          template: "templates/docs/standards/task-template.json.tpl"
        - dest: "docs/standards/coding.json"
          template: "templates/docs/standards/coding.json.tpl"
          note: "Compose only if no existing coding document is available; relocate the saved legacy document byte-for-byte and merge docs/index.json.standards"
        - dest: "scripts/adflow_verify.py"
          template: "scripts/adflow_verify.py"
        - dest: "scripts/adflow-verify"
          template: "scripts/adflow-verify"
      retire_legacy:
        - "docs/devel/change/template.json"
        - "docs/devel/task/template.json"
      note: "Snapshot before relocating standards; preserve coding bytes and custom C/T template fields, stop on differing old/canonical copies. Refresh managed template defaults and verifier copies; merge docs/index.json.standards. Retain established guide names/content and point refreshed links/indexes to actual files. Retire and physically delete legacy template copies (docs/devel/change/template.json and docs/devel/task/template.json) after moving to docs/standards/. Never rewrite business cards, gate blocks, custom rules or human quotes"
    - step: "U5_SYNC_DOCS_INDEX_VERSION"
      action: "PUBLISH_GOVERNANCE_VERSION"
      canonical_tag: "<!-- @ad-flow: initialized v1.5.0 -->"
      target: "docs/index.json"
      field: "adflow_version"
      value: "1.5.0"
      rule: "Publish the canonical tag and index version only after managed assets are synchronized; preserve other index fields and re-read both anchors for agreement. Writes are not cross-file atomic; interrupted version conflicts remain read-only reports"
    - step: "U6_UPGRADE_REPORT"
      action: "REPORT_UPGRADE_COMPLETE"
      evaluation: "Run Step 8 checks without --record; report existing-card violations without rewriting them. Specification sync is distinct from project compliance"
      message: "Report synchronized scope, preserved assets, verification and unresolved findings; do not claim full compliance when blocked."
