# ad-flow Agentic Execution Workflow (Machine-Oriented)
# Specification for AI Agent initialization execution
version: "1.1.0"
workflow_id: "adflow_init"
target_actor: "AI_AGENT"
description: "Deterministic step-by-step state machine for initializing and upgrading ad-flow documentation governance."

# 机器硬性不可变约束 (Invariants)
invariants:
  - id: "INV_NO_AGENT_DELETE_BACKUP"
    rule: "AI Agent is strictly forbidden from deleting, moving, or modifying '_adflow_backup/'"
    severity: "FATAL"
  - id: "INV_NO_AGENT_DELETE_LOCAL"
    rule: "AI Agent is strictly forbidden from deleting or resetting 'local/' directory (housing build outputs, data, logs, and deploy_report.md)"
    severity: "FATAL"
  - id: "INV_EVIDENCE_BASED_DESIGN"
    rule: "AI Agent is strictly forbidden from creating hollow placeholder design docs. When legacy docs exist in '_adflow_backup/original_docs/' or source code exists, Agent MUST synthesize and reconstruct Living Baseline design docs (00-系统总体设计.md, 01~NN-[module].md) adhering to ad-flow 4-chapter and @topic standards."
    severity: "FATAL"
  - id: "INV_BASE_GOVERNANCE_COUNT"
    rule: "At least 21 standardized base governance files must be created upon initialization (plus N reconstructed living design docs if legacy docs/code exist)"
    severity: "FATAL"
  - id: "INV_VERSION_AWARE_UPGRADE_GUARD"
    rule: "If target AGENTS.md contains '<!-- @ad-flow: initialized vX.Y.Z -->', re-initialization is blocked if version matches; if older, pipeline automatically branches to UPGRADE_GOVERNANCE_RULES"
    severity: "FATAL"

pipeline:
  - step: 1
    name: "SURVEY_PROJECT_ASSETS"
    description: "Inspect target workspace, check version/idempotency tag, and determine project category"
    action: "INSPECT"
    inputs:
      target_dir: "${TARGET_DIR:-.}"
    idempotency_and_version_check:
      scan_files:
        - "AGENTS.md"
        - "Agent.md"
        - "agents.md"
        - "docs/index.json"
      tag_pattern: "<!-- @ad-flow: initialized(?: v(?P<ver>[0-9.]+))? -->"
      current_version: "1.1.0"
      on_version_match:
        state: "ALREADY_INITIALIZED_UP_TO_DATE"
        action: "TERMINATE"
        message: "项目已完成 ad-flow 文档治理初始化且版本为最新 (v1.1.0)。严禁重复初始化，安全退出。"
      on_version_outdated:
        state: "NEEDS_UPGRADE"
        action: "BRANCH_TO_UPGRADE_PIPELINE"
        message: "检测到项目治理版本低于当前技能包 (v1.1.0)，正在进入规约与规范平滑升级流程..."
    detection_rules:
      code_indicators:
        - "package.json"
        - "Cargo.toml"
        - "pyproject.toml"
        - "go.mod"
        - "pom.xml"
        - "Makefile"
        - "src/"
        - "lib/"
        - "app/"
      doc_indicators:
        - "*.md"
        - "docs/"
        - "doc/"
        - "openspec/"
        - "openspecs/"
        - ".openspec/"
        - "superpower/"
        - "superpowers/"
        - ".superpower/"
        - ".superpowers/"
        - "specs/"
        - "spec/"
        - "specification/"
        - "specifications/"
        - "architecture/"
      agent_rule_files:
        - "Agent.md"
        - "AGENTS.md"
        - "agents.md"
    outputs:
      state: "ALREADY_INITIALIZED | EMPTY_PROJECT | ONGOING_CODE_AND_DOCS | ONGOING_CODE_ONLY"
      existing_agent_file: "path | null"

  - step: 2
    name: "HUMAN_CONFIRMATION_GATE"
    description: "Guard against unauthorized modification on existing projects"
    condition: "state != 'EMPTY_PROJECT' and state != 'ALREADY_INITIALIZED' and not has_flag('--yes')"
    action: "PROMPT_USER"
    prompt: |
      检测到当前项目处于【进行中】（已存在代码/文档资产）。
      接入 ad-flow 前将自动为您在 `_adflow_backup/` 完整备份现有资产。
      是否确认按照 ad-flow 规范进行文档治理初始化？[y/N]
    branches:
      on_reject:
        action: "TERMINATE"
        exit_code: 0
        message: "用户取消操作，零修改安全退出。"
      on_confirm:
        action: "CONTINUE_TO_STEP_3"

  - step: 3
    name: "CREATE_SAFE_BACKUP"
    description: "Create isolation snapshot zone _adflow_backup/ before modifying target"
    condition: "state != 'EMPTY_PROJECT'"
    action: "CREATE_ISOLATION_SNAPSHOT"
    sub_tasks:
      - create_dir: "${target_dir}/_adflow_backup"
      - write_file:
          path: "${target_dir}/_adflow_backup/README.md"
          content: |
            # ⚠️ ad-flow 安全备份与迁移暂存区 (_adflow_backup/)
            > **绝对安全红线**：
            > 1. AI Agent 严禁擅自删除或篡改本目录；
            > 2. 所有迁移结果已写入 docs/，仅在人类核验无误后由人类在终端手动删除。
      - branch_backup:
          if_has_docs:
            action: "ATOMIC_MOVE_ALL_DOC_ASSETS"
            critical_docs_dir_rule:
              rule: "CRITICAL: If '${target_dir}/docs/' exists, AI Agent MUST execute atomic isolation: mkdir -p ${target_dir}/_adflow_backup/original_docs/ && mv ${target_dir}/docs ${target_dir}/_adflow_backup/original_docs/docs && mkdir -p ${target_dir}/docs. AI must NEVER perform in-place merge in root docs/."
            sources:
              existing_docs_dir:
                source: "${target_dir}/docs"
                dest: "${target_dir}/_adflow_backup/original_docs/docs"
                action: "ATOMIC_MOVE"
              directories:
                - "doc/"
                - "openspec/"
                - "openspecs/"
                - ".openspec/"
                - "superpower/"
                - "superpowers/"
                - ".superpower/"
                - ".superpowers/"
                - "specs/"
                - "spec/"
                - "specification/"
                - "architecture/"
              files:
                - "*.md"
                - "*.txt"
                - "SPEC.md"
                - "SPECS.md"
            dest: "${target_dir}/_adflow_backup/original_docs/"
            behavior: "Atomically move existing docs/ directory into _adflow_backup/original_docs/docs/ and recreate empty docs/; move all other spec directories and root markdown files into _adflow_backup/original_docs/."
          if_code_only:
            action: "ANALYZE_AND_DRAFT"
            dest: "${target_dir}/_adflow_backup/analyzed_drafts/"

  - step: 4
    name: "INJECT_AGENTS_MD"
    description: "Inject project constitution AGENTS.md, merging existing custom rules"
    action: "TEMPLATE_INJECT_WITH_RULE_MERGE"
    inputs:
      template: "templates/AGENTS.md.tpl"
      target_file: "${target_dir}/AGENTS.md"
    merge_logic:
      if_existing_agent_file:
        extract_section: "## 项目自定义规则"
        append_to_bottom: |
          ---

          ## 项目自定义规则 (Project Custom Rules)

          > 本节由 ad-flow 在初始化时自动从原项目的 `{existing_filename}` 保留并迁移，包含本项目特有的业务、架构与团队自定义规则：

          {extracted_rules}

  - step: 5
    name: "SCAFFOLD_DIRECTORIES_AND_READMES"
    description: "Create all 8 governance directories with their respective dedicated README.md"
    action: "WRITE_README_MATRIX"
    mappings:
      - dir: "${target_dir}/docs"
        readme: "${target_dir}/docs/README.md"
        template: "templates/docs/README.md.tpl"
      - dir: "${target_dir}/docs/devel"
        readme: "${target_dir}/docs/devel/README.md"
        template: "templates/docs/devel-README.md.tpl"
      - dir: "${target_dir}/docs/devel/design"
        readme: "${target_dir}/docs/devel/design/README.md"
        template: "templates/docs/design/README.md.tpl"
        constraints:
          - "Embeds 8-section design outline template"
          - "Hollow placeholder specs are prohibited; real specs are generated in STEP 7 via legacy doc synthesis"
      - dir: "${target_dir}/docs/devel/change"
        readme: "${target_dir}/docs/devel/change/README.md"
        template: "templates/docs/change/README.md.tpl"
      - dir: "${target_dir}/docs/devel/task"
        readme: "${target_dir}/docs/devel/task/README.md"
        template: "templates/docs/task/README.md.tpl"
      - dir: "${target_dir}/docs/devel/todo"
        readme: "${target_dir}/docs/devel/todo/README.md"
        template: "templates/docs/todo/README.md.tpl"
      - dir: "${target_dir}/docs/assets"
        readme: "${target_dir}/docs/assets/README.md"
        template: "templates/docs/assets/README.md.tpl"
      - dir: "${target_dir}/docs/guide"
        readme: "${target_dir}/docs/guide/README.md"
        template: "templates/docs/guide/README.md.tpl"
      - dir: "${target_dir}/docs/archive"
        readme: "${target_dir}/docs/archive/README.md"
        template: "templates/docs/archive-README.md.tpl"

  - step: 6
    name: "INJECT_HUBS_AND_CONFIGS"
    description: "Inject index routing hubs, card templates, todo buffers, guide docs, and root configs"
    action: "WRITE_FILES"
    mappings:
      - dest: "${target_dir}/docs/index.json"
        template: "templates/docs/index.json.tpl"
      - dest: "${target_dir}/docs/devel/index.json"
        template: "templates/docs/devel-index.json.tpl"
      - dest: "${target_dir}/docs/guide/index.json"
        template: "templates/docs/guide/index.json.tpl"
      - dest: "${target_dir}/docs/devel/change/index.json"
        template: "templates/docs/change/index.json.tpl"
      - dest: "${target_dir}/docs/devel/change/template.json"
        template: "templates/docs/change/change-card.json.tpl"
      - dest: "${target_dir}/docs/devel/task/index.json"
        template: "templates/docs/task/index.json.tpl"
      - dest: "${target_dir}/docs/devel/task/template.json"
        template: "templates/docs/task/task-card.json.tpl"
      - dest: "${target_dir}/docs/devel/todo/now.md"
        template: "templates/docs/todo/now.md.tpl"
      - dest: "${target_dir}/docs/devel/todo/future.md"
        template: "templates/docs/todo/future.md.tpl"
      - dest: "${target_dir}/docs/guide/01-本地部署指南.md"
        template: "templates/docs/guide/01-本地部署指南.md.tpl"
      - dest: "${target_dir}/CHANGELOG.md"
        template: "templates/docs/changelog.md.tpl"

  - step: 7
    name: "SYNTHESIZE_LEGACY_DOCS_TO_LIVING_BASELINE"
    description: "Read backed up documents and source code, reconstruct living baseline design docs and register them into indexes"
    action: "SYNTHESIZE_AND_RECONSTRUCT"
    condition: "target_dir/_adflow_backup/original_docs/ has files OR target_dir has source code"
    execution_rules:
      1. "Inspect all files in `_adflow_backup/original_docs/` (e.g. openspec/, superpower/, specs/, legacy docs/, root md files) and project source files (src/, cmd/, app/, etc.)."
      2. "Extract system macro-architecture and domain breakdown."
      3. "Generate `docs/devel/design/00-系统总体设计.md`: Global system topology, layer definitions, tech stack, and module matrix."
      4. "For each identified domain/module, generate `docs/devel/design/01~NN-[模块中文名].md`:
         - Strict ad-flow 4-chapter structure: 1. 简介, 2. 索引, 3. 规范, 4. xxx (结合目标与非目标/需求分析/架构设计与模型/接口契约/变更记录矩阵)
         - English metadata headers: created, last-change, status, version
         - Mandatory topic anchor: `<!-- @topic: TopicName -->`
         - Direct reference to changelog index: `[变更总账 (TopicName)](../change/index.json#TopicName)`"
      5. "Automatically register all synthesized design docs and Topics into:
         - `docs/devel/design/README.md` (Update the 《方案清单索引（功能模块矩阵）》 table)
         - `docs/devel/index.json` (Register under design entries)"

  - step: 8
    name: "DOD_VERIFICATION_AND_REPORT"
    description: "Execute hard assertions and report entry points to human developer"
    action: "ASSERT_AND_REPORT"
    assertions:
      base_file_count_minimum: 21
      required_files_exist:
        - "AGENTS.md"
        - "CHANGELOG.md"
        - "docs/README.md"
        - "docs/index.json"
        - "docs/assets/README.md"
        - "docs/guide/README.md"
        - "docs/guide/index.json"
        - "docs/guide/01-本地部署指南.md"
        - "docs/devel/README.md"
        - "docs/devel/index.json"
        - "docs/devel/design/README.md"
        - "docs/devel/change/README.md"
        - "docs/devel/change/index.json"
        - "docs/devel/change/template.json"
        - "docs/devel/task/README.md"
        - "docs/devel/task/index.json"
        - "docs/devel/task/template.json"
        - "docs/devel/todo/README.md"
        - "docs/devel/todo/now.md"
        - "docs/devel/todo/future.md"
        - "docs/archive/README.md"
      forbidden_files_not_exist:
        - "docs/devel/design/01-系统设计方案.md"
      backup_security_check:
        rule: "_adflow_backup/ must remain intact if created; AI must NEVER delete it"
      local_security_check:
        rule: "local/ must NOT be deleted by AI; build outputs, tests and deploys must refer to local/ and local/deploy_report.md"
      baseline_synthesis_check:
        rule: "If legacy docs existed in _adflow_backup/original_docs/, at least 00-系统总体设计.md and corresponding 01~NN design docs must be synthesized"
    report_to_user:
      key_entries:
        - "AGENTS.md"
        - "docs/README.md"
        - "docs/devel/design/README.md"
        - "docs/guide/01-本地部署指南.md"
      synthesized_design_docs: "List all generated 00~NN design docs if reconstructed from legacy assets"
      warning: "若生成了 _adflow_backup/ 或 local/（含打包产物与实况报告），AI 严禁擅自删除，仅由人类手动核验清理。"

upgrade_pipeline:
  trigger: "state == 'NEEDS_UPGRADE'"
  description: "Smoothly synchronize and upgrade all governance constitutions, README specifications, and templates to v1.1.0"
  steps:
    - step: "U1_SNAPSHOT_CURRENT_GOVERNANCE"
      action: "CREATE_UPGRADE_SNAPSHOT"
      dest: "${target_dir}/_adflow_backup/upgrade_snapshot/"
    - step: "U2_SYNC_AGENTS_CONSTITUTION"
      action: "UPDATE_AGENTS_MD"
      template: "templates/AGENTS.md.tpl"
      preservation_rule: "CRITICAL: Retain all custom content under '## 项目自定义规则 (Project Custom Rules)' exactly as-is."
      tag: "<!-- @ad-flow: initialized v1.1.0 -->"
    - step: "U3_SYNC_DIRECTORY_READMES"
      action: "UPDATE_STANDARD_READMES"
      targets:
        - "docs/README.md"
        - "docs/assets/README.md"
        - "docs/devel/README.md"
        - "docs/devel/design/README.md"
        - "docs/devel/change/README.md"
        - "docs/devel/task/README.md"
        - "docs/devel/todo/README.md"
        - "docs/guide/README.md"
        - "docs/archive/README.md"
      note: "Update 4-chapter rules, metadata headers, and guidelines; preserve user module registrations in design/README.md"
    - step: "U4_SYNC_CARD_TEMPLATES"
      action: "UPDATE_TEMPLATES"
      targets:
        - dest: "docs/devel/change/template.json"
          template: "templates/docs/change/change-card.json.tpl"
        - dest: "docs/devel/task/template.json"
          template: "templates/docs/task/task-card.json.tpl"
      note: "Inject new fields (branch, precheck, callback) into template.json; NEVER modify existing Cxxx.json or Txx.json cards"
    - step: "U5_SYNC_DOCS_INDEX_VERSION"
      action: "UPDATE_JSON_FIELD"
      target: "docs/index.json"
      field: "adflow_version"
      value: "1.1.0"
    - step: "U6_UPGRADE_REPORT"
      action: "REPORT_UPGRADE_COMPLETE"
      message: "ad-flow 规范已平滑升级至 v1.1.0。协作宪法、目录规范与卡片模板已同步，所有现有设计方案与业务卡片均完整保留。"
